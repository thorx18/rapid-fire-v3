<!DOCTYPE html>
<html>
<head>
    <title>Local Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .sidebar {
            height: 100vh;
            background: #1e293b;
            padding-top: 20px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            margin: 5px;
            border-radius: 8px;
        }
        .sidebar a:hover { background: #3b82f6; }
        .content { padding: 40px; }
        .card-box {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h3 class="text-center text-white mb-4">📚 Library</h3>
            <a href="/">🏠 Home</a>
            <a href="/books/">📖 All Books</a>
            <a href="/authors/">✍ All Authors</a>
            <a href="/borrowed/">📋 My Borrowed</a>
            <a href="/admin/">⚙ Admin</a>
        </div>

        <!-- Content -->
        <div class="col-md-10 content">
            <div class="card card-box p-5 text-center bg-white">
                <h1 class="display-5 fw-bold text-primary">Local Library Home</h1>
                <p class="lead">Implementation of Django Stack</p>
                <div class="row mt-4">
                    <div class="col-md-3">
                        <div class="card p-3 bg-primary text-white rounded-4">
                            <h3>📚 Books</h3>
                            <p>Manage books records</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 bg-success text-white rounded-4">
                            <h3>✍ Authors</h3>
                            <p>View authors list</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 bg-warning text-dark rounded-4">
                            <h3>📋 Borrowed</h3>
                            <p>Issued books data</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 bg-dark text-white rounded-4">
                            <h3>⚙ Admin</h3>
                            <p>Control panel</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
